<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Чат — DDX AI</title>
  <meta name="theme-color" content="#08080a">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="stylesheet" href="../legal.css">
  <style>
    .m { margin: 14px 0; max-width: 100%; }
    .m.u { margin-left: auto; width: fit-content; max-width: 86%; padding: 10px 16px; border-radius: 22px 22px 6px 22px; background: rgb(var(--w) / .09); white-space: pre-wrap; overflow-wrap: anywhere; }
    .m.a { line-height: 1.65; overflow-wrap: anywhere; }
    .m.a p { margin: 0 0 .7em; }
    .m.a pre { overflow-x: auto; padding: 12px 14px; border-radius: 14px; background: var(--bg2); border: 1px solid var(--line); font: 13px/1.5 ui-monospace, Menlo, monospace; }
    .m.a code { font-family: ui-monospace, Menlo, monospace; font-size: .92em; padding: 1px 6px; border-radius: 6px; background: rgb(var(--w) / .08); }
    .m.a pre code { padding: 0; background: none; }
    .cta { display: block; text-align: center; margin: 32px 0 0; padding: 14px; border-radius: 16px; background: var(--ink); color: var(--bg); font-weight: 700; text-decoration: none; }
    .state { text-align: center; color: var(--mute); padding: 60px 0; }
  </style>
  <script>(function(){try{var m=localStorage.getItem("wchat-theme")||"dark";if(m==="auto")m=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",m)}catch(e){}})()</script>
</head>
<body>
<header class="bar"><div class="bar-in"><span class="brand">DDX AI</span><span class="brand" style="opacity:.6">общий чат</span></div></header>
<main class="wrap">
  <div class="hero"><h1 id="t">Чат</h1></div>
  <div id="c"><p class="state">загружаю…</p></div>
  <a class="cta" href="../">Открыть DDX AI</a>
</main>
<script>
(function () {
  var API = 'https://ddx-ai.wsmp.workers.dev/', id = (location.hash || '').replace(/^#/, '') || new URLSearchParams(location.search).get('id') || '';
  var box = document.getElementById('c');
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function md(t) {
    var parts = String(t).split(/```/), out = '';
    parts.forEach(function (p, i) {
      if (i % 2) { out += '<pre><code>' + esc(p.replace(/^[^\n]*\n/, '')) + '</code></pre>'; return; }
      p = esc(p).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
      p.split(/\n{2,}/).forEach(function (para) { if (para.trim()) out += '<p>' + para.replace(/\n/g, '<br>') + '</p>'; });
    });
    return out;
  }
  if (!id) { box.innerHTML = '<p class="state">ссылка неполная</p>'; return; }
  fetch(API + 'share/get?id=' + encodeURIComponent(id)).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (j) {
    document.getElementById('t').textContent = j.title || 'Чат'; document.title = (j.title || 'Чат') + ' — DDX AI';
    box.innerHTML = '';
    j.msgs.forEach(function (m) {
      var d = document.createElement('div'); d.className = 'm ' + m.r;
      if (m.r === 'u') d.textContent = m.t; else d.innerHTML = md(m.t);
      box.appendChild(d);
    });
  }).catch(function () { box.innerHTML = '<p class="state">чат не найден или ссылка устарела</p>'; });
})();
</script>
</body>
</html>
