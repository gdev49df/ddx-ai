<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DDX AI</title>
  <meta name="description" content="Личный ИИ-чат: спроси что угодно или пришли фото.">

  <!-- pwa: манифест и цвет строки состояния -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#08080a">
  <meta name="color-scheme" content="dark">
  <script src="theme.js"></script>

  <!-- pwa для ios (safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DDX AI">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">

  <link rel="preload" href="fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-in"><div id="splash-logo"></div><p class="splash-name">DDX AI</p><p class="splash-sub">открываю…</p></div>
  </div>

  <div class="app">
    <header class="bar">
      <div class="brand" id="brand">
        <div>
          <p class="label">личный помощник</p>
          <h1>DDX AI</h1>
        </div>
      </div>
      <button class="icon-btn" id="menu" type="button" aria-label="настройки"></button>
    </header>
    <main id="view">
      <div class="hero" id="hero" hidden>
        <p class="mark" aria-hidden="true">ASK</p>
        <p class="mark-cap">спроси что угодно или пришли фото: разберу, объясню, переведу, помогу придумать.</p>
        <div class="chips scroll" id="chips"></div>
        <p class="foot">Создано @bauyrzhanov_12_</p>
      </div>
      <p class="left" id="left" hidden></p>
      <div class="chat" id="chat" role="log" aria-live="polite"></div>
    </main>
  </div>

  <div class="fade" aria-hidden="true"></div>

  <div class="composer" id="composer">
    <div class="card">
      <div class="atts" id="atts" hidden></div>
      <div class="cap-in">
        <button class="ib pick" id="pick" type="button" aria-label="прикрепить фото"></button>
        <textarea class="field" id="t" rows="1" placeholder="спроси что угодно" enterkeyhint="send" aria-label="сообщение"></textarea>
        <button class="ib go" id="send" type="button" aria-label="отправить" disabled></button>
      </div>
    </div>
  </div>
  <input type="file" id="file" accept="image/*" multiple hidden>

  <div class="sheet" id="sheet" hidden><div class="sheet-panel" id="sheet-panel" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="chat.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(console.error); });
    }
  </script>
</body>
</html>
