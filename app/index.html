<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="w chat">
<meta name="theme-color" content="#0b0b10">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>w chat</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#0b0b10;color:#eee;font:16px/1.45 -apple-system,system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;border-bottom:1px solid #1c1c26}
header b{font-size:18px}
header button{background:none;border:1px solid #2a2a38;color:#aaa;border-radius:10px;padding:6px 10px;font-size:14px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:#7c5cff;color:#fff;border-bottom-right-radius:6px}
.a{align-self:flex-start;background:#181822;border-bottom-left-radius:6px}
.e{align-self:center;color:#ff7a7a;font-size:14px}
#empty{margin:auto;color:#666;text-align:center}
form{display:flex;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);border-top:1px solid #1c1c26}
textarea{flex:1;resize:none;max-height:120px;background:#14141c;color:#eee;border:1px solid #2a2a38;border-radius:18px;padding:10px 14px;font:inherit;outline:none}
form button{background:#7c5cff;border:0;color:#fff;border-radius:50%;width:44px;height:44px;font-size:20px;align-self:flex-end}
form button:disabled{opacity:.4}
footer{text-align:center;color:#555;font-size:12px;padding:0 0 calc(env(safe-area-inset-bottom) + 6px)}
</style>
</head>
<body>
<div id="app">
  <header><b>w chat</b><button id="clear">очистить</button></header>
  <div id="log"><div id="empty">напиши что-нибудь</div></div>
  <form id="f"><textarea id="t" rows="1" placeholder="сообщение"></textarea><button id="s" type="submit">↑</button></form>
  <footer>Создано @bauyrzhanov_12_</footer>
</div>
<script>
// адрес твоего воркера (после деплоя замени на свой)
var API = 'https://w-chat.wsmp.workers.dev/';

var log = document.getElementById('log'), t = document.getElementById('t'), s = document.getElementById('s');
var hist = [];
try { hist = JSON.parse(localStorage.getItem('wchat') || '[]'); } catch (e) { hist = []; }
var device = ''; try { device = localStorage.getItem('wchat-dev') || ''; } catch (e) {}
if (!device) { device = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); try { localStorage.setItem('wchat-dev', device); } catch (e) {} }

function save() { try { localStorage.setItem('wchat', JSON.stringify(hist.slice(-40))); } catch (e) {} }
function add(cls, text) {
  var em = document.getElementById('empty'); if (em) em.remove();
  var d = document.createElement('div'); d.className = 'm ' + cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
hist.forEach(function (m) { add(m.role === 'user' ? 'u' : 'a', m.content); });

t.addEventListener('input', function () { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; });
document.getElementById('clear').onclick = function () { hist = []; save(); log.innerHTML = '<div id="empty">напиши что-нибудь</div>'; };

document.getElementById('f').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var q = t.value.trim(); if (!q || s.disabled) return;
  t.value = ''; t.style.height = 'auto';
  hist.push({ role: 'user', content: q }); add('u', q); save();
  s.disabled = true;
  var wait = add('a', '…');
  fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: hist.slice(-20), device: device }) })
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j, st: r.status }; }); })
    .then(function (x) {
      if (x.ok && x.j.answer) { wait.textContent = x.j.answer; hist.push({ role: 'assistant', content: x.j.answer }); save(); }
      else { wait.remove(); hist.pop(); save(); add('e', x.st === 429 ? 'лимит на сегодня исчерпан' : 'ошибка: ' + (x.j.detail || x.j.error || x.st)); }
    })
    .catch(function () { wait.remove(); hist.pop(); save(); add('e', 'нет связи с воркером'); })
    .then(function () { s.disabled = false; log.scrollTop = log.scrollHeight; });
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
